<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>BYTE BACK | 점령된 자료실</title>
  <style>
    :root { color-scheme: dark; font-family: system-ui, sans-serif; }
    body { margin: 0; min-height: 100vh; background: #101a28; color: #ecf4ff; }
    main { max-width: 760px; margin: 0 auto; padding: 44px 22px 64px; }
    .eyebrow { color: #8ad8df; font-size: 14px; font-weight: 700; letter-spacing: .08em; }
    h1 { margin: 16px 0; font-size: clamp(30px, 7vw, 48px); line-height: 1.2; }
    p { font-size: 17px; line-height: 1.7; color: #bfd0e5; }
    .notice { margin: 26px 0; padding: 18px; border: 1px solid #d07384; border-radius: 14px; color: #ffe3e8; background: #612a3544; }
    ul { list-style: none; display: grid; gap: 12px; padding: 0; }
    li { border: 1px solid #51667c; border-radius: 14px; padding: 17px 19px; background: #1a2a3d; }
    strong { display: block; font-size: 18px; margin-bottom: 5px; }
    li span { color: #bfd0e5; }
    form, .bar { display: grid; gap: 10px; margin: 22px 0; }
    label { display: grid; gap: 6px; font-size: 15px; color: #bfd0e5; }
    input { font: inherit; padding: 11px 13px; border: 1px solid #51667c; border-radius: 10px; background: #0d1522; color: #ecf4ff; }
    button { font: inherit; font-weight: 700; padding: 11px 16px; border: 0; border-radius: 10px; background: #8ad8df; color: #0d1522; cursor: pointer; }
    button:disabled { opacity: .6; cursor: wait; }
    .bar { grid-template-columns: 1fr auto; align-items: center; }
    #message { min-height: 1.4em; color: #ffd9a0; }
    textarea { font: inherit; padding: 11px 13px; border: 1px solid #51667c; border-radius: 10px; background: #0d1522; color: #ecf4ff; min-height: 84px; resize: vertical; }
    .actions { display: flex; gap: 8px; margin-top: 12px; }
    .actions button { padding: 7px 12px; font-size: 14px; background: #2b4259; color: #ecf4ff; }
    .actions button.danger { background: #7a2e3d; }
    .edit { display: grid; gap: 10px; }
    [hidden] { display: none; }
  </style>
</head>
<body>
  <main>
    <div class="eyebrow">BYTE BACK · 3단계 진짜 로그인</div>
    <h1>점령된 자료실</h1>
    <p>자료는 코드 밖 학습용 DB에 있고, 서버(/api/notes)가 로그인 확인을 마친 요청에만 보여 줍니다. 로그인하면 내 가상 메모를 추가·수정·삭제할 수 있습니다.</p>
    <div class="notice">이전에 공개된 커밋과 배포 기록은 지워지지 않았습니다. 그때 공개된 자료의 노출은 해소되지 않았습니다.</div>

    <form id="login">
      <label>이메일 <input id="email" type="email" autocomplete="username" required></label>
      <label>비밀번호 <input id="password" type="password" autocomplete="current-password" required></label>
      <button id="submit" type="submit">로그인</button>
    </form>
    <div id="bar" class="bar" hidden>
      <span id="who">로그인되어 있습니다.</span>
      <button id="logout" type="button">로그아웃</button>
    </div>
    <form id="create" hidden>
      <label>새 메모 제목 <input id="new-title" type="text" maxlength="200" required></label>
      <label>내용 <textarea id="new-body" maxlength="5000"></textarea></label>
      <button id="create-submit" type="submit">메모 추가</button>
    </form>
    <div id="message" role="status" aria-live="polite"></div>
    <ul id="notes" aria-live="polite"><li>로그인하면 내 가상 메모가 보입니다.</li></ul>
  </main>

  <!-- 공식 Supabase SDK(@supabase/supabase-js 2.117.2)의 브라우저용 파일입니다. -->
  <script src="/vendor/supabase.js"></script>
  <script>
    // 아래 두 값은 브라우저에 공개되어도 되는 값입니다(프로젝트 주소, 공개 키).
    // 서버 전용 비밀 키는 이 파일에 없습니다. 비밀번호·토큰은 SDK가 다루고 직접 만들지 않습니다.
    const SUPABASE_URL = 'https://vskaxngivuhucmbnoagz.supabase.co';
    const PUBLIC_KEY = 'sb_publishable_v3do9B8hQveB2t_79kgyTQ_SfvTxysG';

    // 로그인 기록은 이 탭에만 둡니다(탭을 닫으면 사라짐). 막혀 있으면 SDK 기본값을 씁니다.
    let tabStorage;
    try { tabStorage = window.sessionStorage; tabStorage.getItem('x'); } catch { tabStorage = undefined; }
    const client = window.supabase.createClient(SUPABASE_URL, PUBLIC_KEY,
      { auth: { storage: tabStorage } });

    const $ = (id) => document.getElementById(id);
    const list = $('notes');
    const message = (text) => { $('message').textContent = text; };
    const placeholder = (text) => {
      const item = document.createElement('li');
      item.textContent = text;
      list.replaceChildren(item);
    };

    // 로그인 실패 이유를 화면에 보여 줍니다. 모르는 오류는 SDK가 준 코드를 그대로 적습니다.
    const REASONS = {
      invalid_credentials: '이메일 또는 비밀번호가 맞지 않습니다.',
      email_not_confirmed: '이메일 확인이 끝나지 않은 계정입니다.',
      user_banned: '이 계정은 사용할 수 없습니다.',
      over_request_rate_limit: '시도가 너무 많습니다. 잠시 뒤 다시 시도해 주세요.',
      validation_failed: '이메일 형식을 확인해 주세요.',
    };
    const reasonOf = (error) => REASONS[error.code]
      || `로그인하지 못했습니다. (${error.code || error.message || '알 수 없는 오류'})`;

    // 모든 메모 요청은 로그인 토큰과 함께 서버(/api/notes)로 갑니다. 사용자 번호나 권한은 보내지 않습니다.
    async function api(method, path, body) {
      const { data } = await client.auth.getSession();
      const token = data.session?.access_token;
      if (!token) throw new Error('로그인이 필요합니다.');
      const response = await fetch(path, {
        method,
        cache: 'no-store',
        headers: { Authorization: `Bearer ${token}`, ...(body ? { 'Content-Type': 'application/json' } : {}) },
        body: body ? JSON.stringify(body) : undefined,
      });
      if (response.status === 401) {
        await client.auth.signOut({ scope: 'local' });
        message('로그인이 확인되지 않아 로그아웃했습니다. 다시 로그인해 주세요.');
        throw new Error('로그인이 필요합니다.');
      }
      if (!response.ok) throw new Error(`요청을 처리하지 못했습니다. (HTTP ${response.status})`);
      return response.json();
    }

    const button = (label, onClick, danger) => {
      const el = document.createElement('button');
      el.type = 'button';
      el.textContent = label;
      if (danger) el.className = 'danger';
      el.addEventListener('click', onClick);
      return el;
    };

    function noteCard(note) {
      const item = document.createElement('li');
      const show = () => {
        const title = document.createElement('strong');
        const content = document.createElement('span');
        title.textContent = note.title;
        content.textContent = note.body;
        const actions = document.createElement('div');
        actions.className = 'actions';
        actions.append(button('수정', edit), button('삭제', remove, true));
        item.replaceChildren(title, content, actions);
      };
      const edit = () => {
        const form = document.createElement('div');
        form.className = 'edit';
        const title = document.createElement('input');
        title.value = note.title;
        title.maxLength = 200;
        const body = document.createElement('textarea');
        body.value = note.body;
        body.maxLength = 5000;
        const actions = document.createElement('div');
        actions.className = 'actions';
        actions.append(button('저장', async () => {
          try {
            const saved = await api('PUT', `/api/notes/${note.id}`, { title: title.value, body: body.value });
            note = saved;
            message('수정했습니다.');
            show();
          } catch (error) { message(error.message); }
        }), button('취소', show));
        form.append(title, body, actions);
        item.replaceChildren(form);
      };
      const remove = async () => {
        try {
          await api('DELETE', `/api/notes/${note.id}`);
          item.remove();
          message('삭제했습니다.');
          if (!list.children.length) placeholder('아직 메모가 없습니다. 위에서 추가해 보세요.');
        } catch (error) { message(error.message); }
      };
      show();
      return item;
    }

    async function loadNotes() {
      placeholder('내 메모를 불러오는 중입니다.');
      try {
        const notes = await api('GET', '/api/notes');
        if (!Array.isArray(notes)) throw new Error('자료 형식이 맞지 않습니다.');
        if (!notes.length) return placeholder('아직 메모가 없습니다. 위에서 추가해 보세요.');
        list.replaceChildren(...notes.map(noteCard));
      } catch (error) {
        placeholder(error.message);
      }
    }

    // 로그인 상태가 바뀔 때마다 화면을 맞춥니다(로그인 전 / 로그인 후 / 로그아웃 후).
    client.auth.onAuthStateChange((event, session) => {
      const signedIn = Boolean(session);
      $('login').hidden = signedIn;
      $('bar').hidden = !signedIn;
      $('create').hidden = !signedIn;
      if (signedIn) {
        $('who').textContent = `로그인됨: ${session.user?.email ?? ''}`;
        if (event === 'INITIAL_SESSION' || event === 'SIGNED_IN') setTimeout(loadNotes, 0);
      } else {
        $('who').textContent = '';
        placeholder('로그인하면 내 가상 메모가 보입니다.');
      }
    });

    $('create').addEventListener('submit', async (event) => {
      event.preventDefault();
      const submit = $('create-submit');
      submit.disabled = true;
      try {
        // 서버가 확인한 로그인 사용자의 메모로 저장됩니다. 화면은 title·body만 보냅니다.
        await api('POST', '/api/notes', { title: $('new-title').value, body: $('new-body').value });
        $('new-title').value = '';
        $('new-body').value = '';
        message('추가했습니다.');
        await loadNotes();
      } catch (error) { message(error.message); } finally { submit.disabled = false; }
    });

    $('login').addEventListener('submit', async (event) => {
      event.preventDefault();
      const button = $('submit');
      button.disabled = true;
      message('');
      try {
        const { error } = await client.auth.signInWithPassword({
          email: $('email').value.trim(), password: $('password').value,
        });
        $('password').value = '';
        if (error) message(reasonOf(error));
      } catch {
        message('로그인하지 못했습니다. 잠시 뒤 다시 시도해 주세요.');
      } finally {
        button.disabled = false;
      }
    });

    $('logout').addEventListener('click', async () => {
      const { error } = await client.auth.signOut();
      message(error ? `로그아웃 중 오류가 있었지만 이 화면에서는 로그아웃했습니다. (${error.message})`
        : '로그아웃했습니다.');
    });
  </script>
</body>
</html>
