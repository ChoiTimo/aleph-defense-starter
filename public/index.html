<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>BYTE BACK | 점령된 자료실</title>
  <style>
    :root { color-scheme: dark; font-family: system-ui, sans-serif; }
    body { margin: 0; min-height: 100vh; background: #101a28; color: #ecf4ff; }
    main { max-width: 760px; margin: 0 auto; padding: 44px 22px 64px; }
    .eyebrow { color: #8ad8df; font-size: 14px; font-weight: 700; letter-spacing: .08em; }
    h1 { margin: 16px 0; font-size: clamp(30px, 7vw, 48px); line-height: 1.2; }
    p { font-size: 17px; line-height: 1.7; color: #bfd0e5; }
    .notice { margin: 26px 0; padding: 18px; border: 1px solid #d07384; border-radius: 14px; color: #ffe3e8; background: #612a3544; }
    ul { list-style: none; display: grid; gap: 12px; padding: 0; }
    li { border: 1px solid #51667c; border-radius: 14px; padding: 17px 19px; background: #1a2a3d; }
    strong { display: block; font-size: 18px; margin-bottom: 5px; }
    li span { color: #bfd0e5; }
    form, .bar { display: grid; gap: 10px; margin: 22px 0; }
    label { display: grid; gap: 6px; font-size: 15px; color: #bfd0e5; }
    input { font: inherit; padding: 11px 13px; border: 1px solid #51667c; border-radius: 10px; background: #0d1522; color: #ecf4ff; }
    button { font: inherit; font-weight: 700; padding: 11px 16px; border: 0; border-radius: 10px; background: #8ad8df; color: #0d1522; cursor: pointer; }
    button:disabled { opacity: .6; cursor: wait; }
    .bar { grid-template-columns: 1fr auto; align-items: center; }
    #message { min-height: 1.4em; color: #ffd9a0; }
    [hidden] { display: none; }
  </style>
</head>
<body>
  <main>
    <div class="eyebrow">BYTE BACK · 3단계 진짜 로그인</div>
    <h1>점령된 자료실</h1>
    <p>자료는 코드 밖 학습용 DB에 있고, 서버(/api/notes)가 로그인 확인을 마친 요청에만 보여 줍니다. 로그인하면 가상 자료를 볼 수 있습니다.</p>
    <div class="notice">이전에 공개된 커밋과 배포 기록은 지워지지 않았습니다. 그때 공개된 자료의 노출은 해소되지 않았습니다.</div>

    <form id="login" autocomplete="on">
      <label>이메일 <input id="email" type="email" autocomplete="username" required></label>
      <label>비밀번호 <input id="password" type="password" autocomplete="current-password" required></label>
      <button id="submit" type="submit">로그인</button>
    </form>
    <div id="bar" class="bar" hidden>
      <span>로그인되어 있습니다.</span>
      <button id="logout" type="button">로그아웃</button>
    </div>
    <div id="message" role="status" aria-live="polite"></div>
    <ul id="notes" aria-live="polite"><li>로그인하면 가상 자료가 보입니다.</li></ul>
  </main>
  <script type="module">
    // 아래 두 값은 브라우저에 공개되어도 되는 값입니다(프로젝트 주소, 공개 키).
    // 서버 전용 비밀 키와 비밀번호는 이 파일에 없고, 비밀번호는 저장하지 않습니다.
    const AUTH = 'https://vskaxngivuhucmbnoagz.supabase.co/auth/v1';
    const PUBLIC_KEY = 'sb_publishable_v3do9B8hQveB2t_79kgyTQ_SfvTxysG';
    const SESSION_KEY = 'byteback.session';

    const $ = (id) => document.getElementById(id);
    const list = $('notes');
    const message = (text) => { $('message').textContent = text; };
    const placeholder = (text) => {
      const item = document.createElement('li');
      item.textContent = text;
      list.replaceChildren(item);
    };

    // 토큰은 이 탭에만 둡니다(탭을 닫으면 사라짐). 저장이 막혀 있어도 화면은 동작합니다.
    let session = null;
    const readSession = () => {
      try { return JSON.parse(sessionStorage.getItem(SESSION_KEY)); } catch { return null; }
    };
    const writeSession = (value) => {
      session = value;
      try {
        if (value) sessionStorage.setItem(SESSION_KEY, JSON.stringify(value));
        else sessionStorage.removeItem(SESSION_KEY);
      } catch { /* 저장 불가: 메모리에만 둡니다. */ }
    };
    const show = (signedIn) => {
      $('login').hidden = signedIn;
      $('bar').hidden = !signedIn;
    };

    async function loadNotes() {
      placeholder('가상 자료를 불러오는 중입니다.');
      try {
        const response = await fetch('/api/notes', {
          cache: 'no-store',
          headers: { Authorization: `Bearer ${session.access_token}` },
        });
        if (response.status === 401) {
          writeSession(null);
          show(false);
          placeholder('로그인하면 가상 자료가 보입니다.');
          message('로그인이 만료되었거나 확인되지 않았습니다. 다시 로그인해 주세요.');
          return;
        }
        if (!response.ok) throw new Error('자료를 읽을 수 없습니다.');
        const data = await response.json();
        if (!Array.isArray(data.notes)) throw new Error('자료 형식이 맞지 않습니다.');
        list.replaceChildren(...data.notes.map((note) => {
          const item = document.createElement('li');
          const title = document.createElement('strong');
          const content = document.createElement('span');
          title.textContent = note.title;
          content.textContent = note.content;
          item.append(title, content);
          return item;
        }));
        message('');
      } catch (error) {
        placeholder(error.message);
      }
    }

    $('login').addEventListener('submit', async (event) => {
      event.preventDefault();
      const button = $('submit');
      button.disabled = true;
      message('');
      try {
        const response = await fetch(`${AUTH}/token?grant_type=password`, {
          method: 'POST',
          headers: { apikey: PUBLIC_KEY, 'Content-Type': 'application/json' },
          body: JSON.stringify({ email: $('email').value.trim(), password: $('password').value }),
        });
        $('password').value = '';
        if (!response.ok) {
          message('이메일 또는 비밀번호가 맞지 않습니다.');
          return;
        }
        const token = await response.json();
        if (typeof token.access_token !== 'string') throw new Error('bad_response');
        writeSession({ access_token: token.access_token });
        show(true);
        await loadNotes();
      } catch {
        message('로그인하지 못했습니다. 잠시 뒤 다시 시도해 주세요.');
      } finally {
        button.disabled = false;
      }
    });

    $('logout').addEventListener('click', async () => {
      const token = session?.access_token;
      writeSession(null);
      show(false);
      placeholder('로그인하면 가상 자료가 보입니다.');
      message('로그아웃했습니다.');
      if (!token) return;
      // 서버의 로그인 기록도 끝냅니다. 실패해도 이 화면의 토큰은 이미 지웠습니다.
      try {
        await fetch(`${AUTH}/logout`, {
          method: 'POST',
          headers: { apikey: PUBLIC_KEY, Authorization: `Bearer ${token}` },
        });
      } catch { /* 무시 */ }
    });

    session = readSession();
    if (session?.access_token) { show(true); await loadNotes(); } else { show(false); }
  </script>
</body>
</html>
